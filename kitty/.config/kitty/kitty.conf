# --- FONTS ---
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- CURSOR ---
cursor_shape     beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# --- SCROLLBACK ---
scrollback_lines 2000

# --- MOUSE ---
mouse_hide_wait  3.0
url_color        #d77593
url_style        curly

# --- TERMINAL BELL ---
enable_audio_bell no

# --- WINDOW LAYOUT ---
window_padding_width 4
placement_strategy center
hide_window_decorations yes
background_opacity 0.95
cursor_trail 1
remember_window_size no
initial_window_width  650
initial_window_height 400

# --- COLOR SCHEME ---
foreground            #f3f2f2
background            #231a1d
cursor                #f3f2f2
cursor_text_color     #231a1d
cursor_trail_color    #b6afb1
selection_foreground  #b6afb1
selection_background  #302126
active_border_color   #d77593
inactive_border_color #302126
active_tab_foreground   #221b1d
active_tab_background   #d77593
inactive_tab_foreground #b6afb1
inactive_tab_background #302126

# Color Palette
color0   #302126
color8   #736368
color1   #ff1f54
color9   #ff1f54
color2   #d77593
color10  #d77593
color3   #c77d6b
color11  #c77d6b
color4   #c2a970
color12  #c2a970
color5   #dea1b3
color13  #dea1b3
color6   #dcaea3
color14  #dcaea3
color7   #f3f2f2
color15  #f3f2f2

# --- SHORTCUTS ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down

# Switch focus between split windows using arrows
map ctrl+left   neighboring_window left
map ctrl+right  neighboring_window right
map ctrl+up     neighboring_window up
map ctrl+down   neighboring_window down

# Cycle through windows
map alt+tab     next_window
map alt+shift+tab previous_window

map f10 toggle_maximized
map f11 toggle_fullscreen
